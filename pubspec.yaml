name: truust_rider
description: Truust Rider — Earn money delivering goods securely.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  cloud_functions: ^4.6.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_app_check: ^0.2.1+3

  # State management
  flutter_bloc: ^8.1.4
  uuid: ^4.3.3

  # UI
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  url_launcher: ^6.3.0

  # Utils
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7        # pickup/delivery photos
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dependency_overrides: {}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
